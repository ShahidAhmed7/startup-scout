# Model routing, scoring and limits. Secrets live in .env and scout-secrets.
timezone: Asia/Dhaka
output_language: English
digest_time: 08:00
digest_mix:
  bangladesh: 3
  global: 2
min_score: 6.5
diversity:
  one_per_sector: true
  max_ai_native: 3
  max_same_business_model: 2
  min_non_us_picks: 1
  novelty_days: 30
  novelty_similarity: 0.85
  explore_rows: 5
  explore_min_score: 5
quality:
  max_research_swaps: 3
skip_list:
- frontier AI model labs
- chips and semiconductors
- robotics hardware
- data centers and GPU clouds
- energy infrastructure
- space
- biotech wet labs
jobs:
  score:
  - &id001
    - strong_main
    - strong_backup
  - &id002
    - fast_main
    - fast_backup
  - &id003
    - open_main
    - open_backup
  - - private
  card:
  - *id001
  - *id002
  - *id003
  - - private
  deep_dive:
  - *id001
  - *id002
  - *id003
  - - private
  friday:
  - *id001
  - *id002
  - *id003
  - - private
  explore:
  - *id001
  - *id002
  - *id003
  - - private
  ask:
  - *id001
  - *id002
  - *id003
  - - private
  kit:
  - *id001
  - *id002
  - *id003
  - - private
  extract:
  - *id002
  - *id003
  - - private
  classify:
  - *id002
  - *id003
  - - private
  private:
  - - private
models:
  strong_main:
    model: google:gemini-4-hydrogen
    key_env: GEMINI_API_KEY_MAIN
    rpm: 5
    cap_per_day: 18
    concurrency: 2
    settings:
      thinking: high
      max_output_tokens: 65536
      timeout_s: 300
    reserve_for_chat: 4
  strong_backup:
    model: google:gemini-4-hydrogen
    key_env: GEMINI_API_KEY_BACKUP
    rpm: 5
    cap_per_day: 18
    concurrency: 2
    settings:
      thinking: high
      max_output_tokens: 65536
      timeout_s: 300
    reserve_for_chat: 4
  fast_main:
    model: google:gemini-3.5-flash-lite
    key_env: GEMINI_API_KEY_MAIN
    rpm: 15
    cap_per_day: 150
    concurrency: 3
    settings:
      thinking: high
      max_output_tokens: 65536
      timeout_s: 300
  fast_backup:
    model: google:gemini-3.5-flash-lite
    key_env: GEMINI_API_KEY_BACKUP
    rpm: 15
    cap_per_day: 150
    concurrency: 3
    settings:
      thinking: high
      max_output_tokens: 65536
      timeout_s: 300
  open_main:
    model: google:gemma-4-31b-it
    key_env: GEMINI_API_KEY_MAIN
    rpm: 15
    cap_per_day: 300
    concurrency: 2
    settings:
      thinking: high
      max_output_tokens: 32768
      timeout_s: 300
  open_backup:
    model: google:gemma-4-31b-it
    key_env: GEMINI_API_KEY_BACKUP
    rpm: 15
    cap_per_day: 300
    concurrency: 2
    settings:
      thinking: high
      max_output_tokens: 32768
      timeout_s: 300
  private:
    model: openai-chat:Qwen/Qwen3.6-27B-FP8
    base_url_env: QWEN_BASE_URL
    key_env: QWEN_API_KEY
    concurrency: 4
    budget_guard: true
    stream: true
    settings:
      max_output_tokens: 16384
      timeout_s: 1200
    cold_start_seconds: 480
firecrawl:
  monthly_credit_cap: 900
  daily_credit_cap: 40
budget:
  modal_warn_usd: 20
  modal_stop_usd: 25
  a100_80gb_usd_per_second: 0.000694
  cpu_usd_per_core_second: 1.31e-05
  memory_usd_per_gib_second: 2.22e-06
  cpu_allowance_usd_per_month: 1.0
whatsapp:
  graph_api_version: v27.0
  window_minutes: 1430
reports:
  friday: true
  monthly: true
markets_like_ours:
- India
- Pakistan
- Indonesia
- Philippines
- Vietnam
- Nigeria
- Kenya
- Egypt
- Middle East
min_picks: 3
fill_min_score: 5.0
ambition: any
scoring:
  bangladesh:
    demand: 1.3
    readiness: 1.0
    competition_gap: 0.8
    regulatory_path: 0.8
    economics: 1.1
    timing: 0.5
  global:
    demand_abroad: 1.3
    remote_delivery: 1.0
    cost_advantage: 0.9
    trust_burden: 0.8
    competition_gap: 0.8
    timing: 0.5
  evidence_bonus:
    traction_known: 0.3
    investor_known: 0.2
  low_confidence_penalty: 1.0
  unknown_product_max: 3
verdicts:
  strong: 8.0
  promising: 6.5
  watch: 5.0
pool:
  max_to_score: 120
  max_share:
    usa: 0.35
    europe: 0.15
    china: 0.1
  min_share:
    similar_markets: 0.4
  max_ai_native_share: 0.4
embedding_model: gemini-embedding-2
dev_jobs:
  extract:
  - *id002
  classify:
  - *id002
  score:
  - *id002
  card:
  - *id002
  deep_dive:
  - *id002
  friday:
  - *id002
  explore:
  - *id002
  ask:
  - *id002
  kit:
  - *id002
chat_jobs:
- deep_dive
- ask
- kit
- explore
