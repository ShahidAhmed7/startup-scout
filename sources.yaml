# Where Startup Scout reads news. All free. Every URL was tested on 2026-11-19.
#
# Fields:
#   id        unique, used in the database
#   kind      rss | api | gnews (Google News RSS search) | gdelt
#   region    global | usa | europe | india | pakistan | mideast | africa | sea | china | bangladesh
#   role      funding (goes through funding extraction) | context (Bangladesh/market context, competitor checks)
#   priority  high | normal   (owner: YC and US news are top priority; trim "normal" first if volume is too high)
#   lang      en unless noted; non-English items are translated to English during extraction
#   status    active | spare (works, not fetched yet) | flaky (try again later) | dead (don't use)
#
# Politeness: one clear User-Agent, conditional GET (ETag / Last-Modified), at least 1 second
# between requests to the same host, never bypass paywalls, logins or 403 blocks.

defaults:
  user_agent: "StartupScout/0.1 (private news digest; polite RSS reader)"
  lookback_hours: 36
  min_seconds_between_requests_same_host: 1.0
  timeout_seconds: 20

